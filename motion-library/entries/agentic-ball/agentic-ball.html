<!-- Continia Motion Library — Agentic Ball
     Load in this order: tokens/motion-tokens.css, base/base-animations.css,
     then this entry's stylesheet. The module is an ES module and mounts itself
     onto every [data-ml="agentic-ball"] on the page.

       <link rel="stylesheet" href="motion-library/tokens/motion-tokens.css">
       <link rel="stylesheet" href="motion-library/base/base-animations.css">
       <link rel="stylesheet" href="motion-library/entries/agentic-ball/agentic-ball.css">
       <script type="module" src="motion-library/entries/agentic-ball/agentic-ball.js"></script>

     The children are kept and laid over the ball, so the module never owns the
     copy. It is ambient in the strict sense - it never resolves - so it is a
     state, not an event.
-->

<div data-ml="agentic-ball" data-state="thinking">
  <p class="mlab-label">Working on it</p>
</div>


<!-- Driven from the assistant, which is the whole point of the four states.
