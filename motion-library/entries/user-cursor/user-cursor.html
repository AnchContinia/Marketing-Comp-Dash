<!-- Requires: motion-library/tokens/motion-tokens.css,
               motion-library/entries/user-cursor/user-cursor.css
     Script:   motion-library/entries/user-cursor/user-cursor.js (type="module")

     The children are yours - the module moves them into a content layer and
     paints the cursor on a layer above, then puts them back on destroy().
     With a pointer on the stage the cursor follows it; with none it wanders on
     its own, which is what makes the thing demonstrate itself in a card.
     Every option is also a data-* attribute; see meta.json for the full list. -->
<div data-ml="user-cursor" data-name="Sophie" data-height="360">
  <span class="mluc-eyebrow">Move your cursor here</span>
  <span class="mluc-title">Hello, Sophie</span>
</div>

<script type="module" src="motion-library/entries/user-cursor/user-cursor.js"></script>

<!-- A softer, later cursor: raise both time constants and keep the gap between
     them. follow is how long the arrow takes to close 63% of the distance to
     the pointer; labelFollow is the same for the pill, and the difference is
     the only thing that makes the pill trail.

<div data-ml="user-cursor" data-name="Sophie"
     data-follow="260" data-label-follow="380" data-tilt="8" data-drift="14">…</div>
