<!-- Requires: motion-library/tokens/motion-tokens.css,
               motion-library/entries/magic-transform/magic-transform.css
     Script:   motion-library/entries/magic-transform/magic-transform.js (type="module")

     Everything inside the stage is drawn by the module, so the plain case is a
     single empty div. Children are optional templates, not stage furniture:
     [data-mt-doc] replaces the procedural documents, [data-mt-result] the
     pieces thrown out the far side, and [data-mt-core] is whatever sits on the
     axis. A document is never cut up - it travels on and the lane's clipped
     edge takes it, so it reads as sliding in under the line.
     Every option is also a data-* attribute; see meta.json for the full list. -->
<div data-ml="magic-transform" data-height="480" data-doc-duration="4">
  <!-- .mlmt-mark paints the file as a mask over the tile's own ink, so the
       hourglass is white on the Tech Blue tile in light mode and Tech Blue on
       the Innovation Blue tile in dark - from the one white SVG. A logo that
       has to keep its own colours goes in as a plain <img> instead. -->
  <span data-mt-core class="mlmt-mark"
        style="-webkit-mask-image:url(Assets/Hourglass.svg);mask-image:url(Assets/Hourglass.svg)"></span>
</div>

<script type="module" src="motion-library/entries/magic-transform/magic-transform.js"></script>
