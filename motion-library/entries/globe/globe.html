<!-- Continia Motion Library — Globe
     Load in this order: tokens/motion-tokens.css, base/base-animations.css,
     then this entry's stylesheet. The module is an ES module and mounts
     itself onto every [data-ml="globe"] on the page.

       <link rel="stylesheet" href="motion-library/tokens/motion-tokens.css">
       <link rel="stylesheet" href="motion-library/base/base-animations.css">
       <link rel="stylesheet" href="motion-library/entries/globe/globe.css">
       <script type="module" src="motion-library/entries/globe/globe.js"></script>

     The children are kept and laid over the canvas, so this is a background
     with copy on it - the module never owns the copy. It is ambient: it never
     resolves, so put it behind something rather than beside it as a thing to
     watch.
-->

<div data-ml="globe" data-height="460">
  <h2 class="mlgb-demo">Everywhere our partners are</h2>
</div>
