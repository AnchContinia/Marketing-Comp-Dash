<!-- Continia Motion Library — Portrait Circles
     Load in this order: tokens/motion-tokens.css, base/base-animations.css,
     then this entry's stylesheet. The module is an ES module and mounts
     itself onto every [data-ml="portrait-circles"] on the page.

       <link rel="stylesheet" href="motion-library/tokens/motion-tokens.css">
       <link rel="stylesheet" href="motion-library/base/base-animations.css">
       <link rel="stylesheet" href="motion-library/entries/portrait-circles/portrait-circles.css">
       <script type="module" src="motion-library/entries/portrait-circles/portrait-circles.js"></script>

     The children are kept and laid in the middle of the rings, so this is a
     background with copy on it - the module never owns the copy. It is
     ambient: it never resolves, so put it behind something rather than beside
     it as a thing to watch.
-->

<div data-ml="portrait-circles" data-height="460">
  <h2 class="mlpc-demo">2,000+ partners</h2>
</div>
