<!-- Continia Motion Library — Tile Reveal

     Two stylesheets and one module. user-cursor.css is a real dependency, not a
     convenience: the arrow on the stage IS the User Cursor entry, mounted by
     this module rather than redrawn. Drop it, and set data-cursor="0", if the
     section is a real one a visitor scrolls themselves.

     <link rel="stylesheet" href="motion-library/tokens/motion-tokens.css">
     <link rel="stylesheet" href="motion-library/entries/user-cursor/user-cursor.css">
     <link rel="stylesheet" href="motion-library/entries/tile-reveal/tile-reveal.css">
     <script type="module" src="motion-library/entries/tile-reveal/tile-reveal.js"></script>

     A tile is any direct child, laid into the columns x rows grid in order.
     Fewer children than cells leaves gaps; extras are ignored. The whole
     section is one number - the scroll position - so seeking backwards takes
     everything back, including the call to action. -->
