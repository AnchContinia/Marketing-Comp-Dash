<!-- Requires: motion-library/tokens/motion-tokens.css, motion-library/base/base-animations.css
     No JavaScript. To trigger on scroll, add class "ml-paused" and remove it with an IntersectionObserver. -->
<div class="ml-flip-in-y">Automate your AP in Business Central</div>

<!-- slower: ml-slow (1.5x), ml-slower (2x), ml-slowest (3x) -->
<div class="ml-flip-in-y ml-slower">Automate your AP in Business Central</div>

<!-- staggered: --ml-index multiplies --motion-stagger-base -->
<ul>
  <li class="ml-flip-in-y" style="--ml-index: 0">Document Capture</li>
  <li class="ml-flip-in-y" style="--ml-index: 1">Expense Management</li>
  <li class="ml-flip-in-y" style="--ml-index: 2">Continia Banking</li>
</ul>
